<!-- @dsCard group="Colors" viewport="700x130" subtitle="Gold, black, white, and semantic" name="Special & Semantic" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);display:flex;height:130px;gap:6px;padding:12px;background:#f8fafc;flex-wrap:wrap}
.c{width:80px;height:50px;border-radius:8px;display:flex;align-items:end;padding:6px;box-sizing:border-box}
.c span{font-size:9px;line-height:1.2}</style>
<div class="c" style="background:var(--color-gold-400)"><span style="color:#7C2D12">Ouro<br>#FBBF24</span></div>
<div class="c" style="background:var(--color-gold-500)"><span style="color:#7C2D12">Gold 500<br>#EAB308</span></div>
<div class="c" style="background:var(--color-black);border:1px solid #333"><span style="color:#fff">Black<br>#0A0A0A</span></div>
<div class="c" style="background:var(--color-white);border:1px solid #e2e8f0"><span style="color:#334155">White<br>#FFFFFF</span></div>
<div class="c" style="background:#DC2626"><span style="color:#fff">Error<br>#DC2626</span></div>
<div class="c" style="background:var(--color-teal-600)"><span style="color:#fff">Success<br>#0D9488</span></div>
<div class="c" style="background:var(--color-gold-500)"><span style="color:#7C2D12">Warning<br>#EAB308</span></div>
