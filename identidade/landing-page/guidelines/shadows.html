<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 24px;font-family:var(--font-body);background:var(--color-slate-100);display:flex;align-items:center;gap:20px;height:120px;box-sizing:border-box}
.s{width:100px;height:72px;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center}
.s span{font-size:11px;color:var(--color-slate-500)}</style>
<div class="s" style="box-shadow:var(--shadow-xs)"><span>xs</span></div>
<div class="s" style="box-shadow:var(--shadow-sm)"><span>sm</span></div>
<div class="s" style="box-shadow:var(--shadow-md)"><span>md</span></div>
<div class="s" style="box-shadow:var(--shadow-lg)"><span>lg</span></div>
<div class="s" style="box-shadow:var(--shadow-xl)"><span>xl</span></div>
