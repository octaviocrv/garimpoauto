<link rel="stylesheet" href="../../styles.css">
<style>
body { margin: 0; padding: 24px; background: #f8fafc; font-family: var(--font-body); }
.grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
.item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.item span { font-size: 11px; color: var(--color-slate-500); }
</style>
<div class="grid">

  <div class="item">
    <div style="width:120px;height:120px;border-radius:50%;background:var(--color-teal-700);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(15,118,110,0.3)">
      <div style="width:104px;height:104px;border-radius:50%;border:3.5px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center">
        <img src="../../assets/mascot-han-face.jpeg" style="width:116px;height:116px;object-fit:cover;object-position:center top;margin-top:10px">
      </div>
    </div>
    <span>Teal Circle</span>
  </div>
  <!-- Black Circle -->
  <div class="item">
    <div style="width:120px;height:120px;border-radius:50%;background:var(--color-black);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.3)">

      </div>

    <span>Orange Circle</span>
  </div>
  <!-- Teal Rounded Square -->
  <div class="item">
    <div style="width:120px;height:120px;border-radius:28px;background:var(--color-teal-700);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(15,118,110,0.3)">
