<!-- @dsCard group="Spacing" viewport="700x120" subtitle="Border radius tokens" name="Corner Radii" -->
<link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px 24px;font-family:var(--font-body);background:#fff;display:flex;align-items:center;gap:16px;height:120px;box-sizing:border-box}
.r{width:64px;height:64px;border:2px solid var(--color-teal-700);display:flex;align-items:center;justify-content:center}
.r span{font-size:10px;color:var(--color-teal-700);text-align:center;line-height:1.2}</style>
<div class="r" style="border-radius:var(--radius-sm)"><span>sm<br>4px</span></div>
<div class="r" style="border-radius:var(--radius-md)"><span>md<br>8px</span></div>
<div class="r" style="border-radius:var(--radius-lg)"><span>lg<br>12px</span></div>
<div class="r" style="border-radius:var(--radius-xl)"><span>xl<br>16px</span></div>
<div class="r" style="border-radius:var(--radius-2xl)"><span>2xl<br>24px</span></div>
<div class="r" style="border-radius:var(--radius-full)"><span>full<br>999</span></div>
